services:
  - type: web
    name: avpc-federacio-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    # NOTA: el pla free de Render no permet discos persistents. Els fitxers
    # pujats (estatuts, actes, documentació) es guarden al disc efímer del
    # contenidor i es poden perdre en cada redeploy o reinici del servei.
    # Si cal persistència real, cal passar a un pla de pagament i afegir:
    #   disk:
    #     name: avpc-federacio-uploads
    #     mountPath: /opt/render/project/src/backend/src/uploads
    #     sizeGB: 1
    #
    # NOTA: la base de dades ja no és el Postgres gratuït de Render (limitat
    # a 1GB i que caduca) sinó un projecte de Neon (neon.tech, 3GB gratuïts,
    # sense caducitat). DATABASE_URL es gestiona manualment des del dashboard
    # de Render (Environment), no amb fromDatabase.
    envVars:
      - key: DATABASE_URL
        sync: false
      # Mateixa connexió que DATABASE_URL però SENSE "-pooler" al host. Neon
      # posa DATABASE_URL darrere d'un pooler (PgBouncer) que no suporta bé
      # l'advisory lock que "prisma migrate deploy" necessita agafar, i el
      # deploy queda penjat fent timeout; DIRECT_URL evita això.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Clau API de resend.com per enviar per correu l'"Alerta a Federació".
      # Sense aquesta variable, l'alerta només s'envia per notificació push
      # (no falla, simplement no envia el correu).
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: avpc-federacio-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Després del primer deploy, edita aquest valor al dashboard de Render
      # amb la URL real del backend, p.ex. https://avpc-federacio-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://avpc-federacio-backend.onrender.com/api
