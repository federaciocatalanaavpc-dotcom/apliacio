services:
  - type: web
    name: avpc-federacio-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Documents guardats a PostgreSQL. Connexions gestionades a Render.
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      # Mateixa connexió que DATABASE_URL però SENSE "-pooler" al host. Neon
      # posa DATABASE_URL darrere d'un pooler (PgBouncer) que no suporta bé
      # l'advisory lock que "prisma migrate deploy" necessita agafar, i el
      # deploy queda penjat fent timeout; DIRECT_URL evita això.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Clau API de resend.com per enviar per correu l'"Alerta a Federació".
      # Sense aquesta variable, l'alerta només s'envia per notificació push
      # (no falla, simplement no envia el correu).
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: avpc-federacio-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Després del primer deploy, edita aquest valor al dashboard de Render
      # amb la URL real del backend, p.ex. https://avpc-federacio-backend.onrender.com/api
      - key: VITE_API_URL
        value: https://avpc-federacio-backend.onrender.com/api
